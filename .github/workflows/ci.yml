name: CI
# IMPORTANT: This repo uses default GitHub Actions permissions (read-only).
# The `release-please` job needs "Allow GitHub Actions to create and approve
# pull requests" enabled in: Repo Settings → Actions → General → Workflow
# permissions. Without it, the job fails with:
#   "GitHub Actions is not permitted to create or approve pull requests."
# Alternative (more secure, optional): set PERSONAL_ACCESS_TOKEN secret and use
# it instead of GITHUB_TOKEN in the release-please step. See AGENTS.md →
# "Release-please setup" for details.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Single job on GitHub-hosted ubuntu-latest. Self-hosted runner was tried
# (commit 9fd7913) but the registered self-hosted runner is for a
# different repo (tui-translator), so it never picked up vibeflow jobs —
# they sat in "pending" forever. Reverted to cloud-only after 1h+ of
# pending with no runner pickup.
#
# To re-enable self-hosted, first register a runner for this repo at
# https://github.com/magicpro97/vibeflow/settings/actions/runners
# then change `runs-on: ubuntu-latest` below to
# `runs-on: [self-hosted, linux, x64]`.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Smoke test built CLI (prints version)
        run: node dist/cli.js --version
      - name: Coverage gate — fail if line coverage < 100%
        run: bun run coverage:check
      - name: Ship-gate — real bridge dispatch must complete (no nothing works)
        run: bun run smoke
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Web UI e2e (real dashboard in Chromium)
        run: bun run test:e2e

  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
