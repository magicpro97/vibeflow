name: CI
# IMPORTANT: This repo uses default GitHub Actions permissions (read-only).
# The `release-please` job needs "Allow GitHub Actions to create and approve
# pull requests" enabled in: Repo Settings → Actions → General → Workflow
# permissions. Without it, the job fails with:
#   "GitHub Actions is not permitted to create or approve pull requests."
# Alternative (more secure, optional): set PERSONAL_ACCESS_TOKEN secret and use
# it instead of GITHUB_TOKEN in the release-please step. See AGENTS.md →
# "Release-please setup" for details.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Runner priority:
#   Default: ubuntu-latest (GitHub-hosted, always available)
#   Self-hosted: set repo variable USE_SELF_HOSTED=true to switch to MacBook.
#     Go to Settings → Secrets and variables → Actions → Variables → New variable
#     Name: USE_SELF_HOSTED, Value: true
#     When the MacBook is online, jobs run faster (no GitHub queue).
#     When offline, set to 'false' (or delete the variable) to go back to cloud.
#     The self-hosted runner is a Mac on Apple Silicon registered at
#     ~/actions-runner-vibeflow/ with labels [self-hosted, macOS, ARM64].
#
# Self-hosted runner setup (one-time):
#   1. cd ~/actions-runner-vibeflow
#   2. ./config.sh --unattended --url https://github.com/magicpro97/vibeflow \
#       --token <registration-token-from-repo-settings> \
#       --labels "self-hosted,macOS,ARM64" \
#       --name "mac-selfhost-vibeflow"
#   3. ./run.sh   # or: ./svc.sh install && ./svc.sh start

jobs:
  check:
    needs: landing
    if: ${{ always() }}
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-latest' }}
    # Coverage instrumentation makes full-suite coverage gate ~10min, so 15m was too tight.
    timeout-minutes: 30
    steps:
      - name: Require landing gate
        if: ${{ needs.landing.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v4
        with:
          # The self-hosted runner accumulates stale uncommitted
          # deletions across runs (e.g. `.agents/skills/*` from a
          # prior WIP). `clean: true` forces a fresh checkout on
          # every CI run so tests that depend on tracked files
          # (e.g. `copySkillCreator` looking for
          # `.agents/skills/skill-creator/`) see a clean state.
          clean: true
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run file-size:check
      - run: bun run waiver:check
      - run: bun run build
      - run: bun run test
      - name: Smoke test built CLI (prints version)
        run: node dist/cli.js --version
      - name: Coverage gate — fail if line coverage < 100%
        run: bun run coverage:check
      - name: Ship-gate — real bridge dispatch must complete (no nothing works)
        run: bun run smoke
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Web UI e2e (real dashboard in Chromium)
        run: rm -f ~/.vibeflow/projects.json && bun run test:e2e

  windows-owned-process:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      VF_REQUIRE_LIVE_WINDOWS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun ci
      - name: Assert a real Windows runtime
        # File-based (not an inline `bun -e`): bun 1.4.0 on Windows runners
        # can crash in its eval path (Bun "Features:" crash banner, exit 1)
        # even when the condition is false. The committed script uses the
        # same module path as the `bun test` smoke step below and fails only
        # when the live runtime is not win32.
        run: bun run scripts/assert-win32.ts
      - name: Windows PID, Job Object, release, and orphan smoke
        run: bun test --timeout 30000 test/dispatch-owned-process-windows.test.ts test/dispatch-owned-process-windows-live.test.ts

  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install locked landing dependencies
        working-directory: landing
        run: npm ci
      - name: Landing copy and mirror gate
        working-directory: landing
        run: npm test
      - name: Build landing
        working-directory: landing
        run: npm run build
      - name: Install landing browser
        working-directory: landing
        run: npx playwright install --with-deps chromium
      - name: Landing accessibility, responsive, and overflow gate
        working-directory: landing
        run: npm run test:a11y

  skill-validation:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run build
      - name: Skill validation gate
        run: node dist/cli.js skills ci-validation

  skill-security:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run build
      - name: Skill security gate
        run: node dist/cli.js skills ci-security

  domain-integrity:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run build
      - name: Domain integrity gate
        run: node dist/cli.js skills ci-domain-integrity

  release-prerequisites:
    needs:
      - check
      - windows-owned-process
      - landing
      - skill-validation
      - skill-security
      - domain-integrity
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every same-SHA release gate
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          WINDOWS_RESULT: ${{ needs.windows-owned-process.result }}
          LANDING_RESULT: ${{ needs.landing.result }}
          SKILL_VALIDATION_RESULT: ${{ needs.skill-validation.result }}
          SKILL_SECURITY_RESULT: ${{ needs.skill-security.result }}
          DOMAIN_INTEGRITY_RESULT: ${{ needs.domain-integrity.result }}
        run: |
          test "$CHECK_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$LANDING_RESULT" = success
          test "$SKILL_VALIDATION_RESULT" = success
          test "$SKILL_SECURITY_RESULT" = success
          test "$DOMAIN_INTEGRITY_RESULT" = success
          echo "Release prerequisites passed for $GITHUB_SHA"

  release-please:
    needs: release-prerequisites
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-latest' }}
    # Only run release-please on main-branch pushes. Self-hosted
    # runner so it doesn't queue on cloud throttling.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-prerequisites.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ github.sha }}
      - name: release-please action
        # Token priority:
        # 1. VIBEFLOW_BOT_TOKEN (PAT, no repo setting required)
        # 2. GITHUB_TOKEN (default, requires "Allow GitHub Actions
        #    to create and approve pull requests" in repo settings)
        #
        # Set VIBEFLOW_BOT_TOKEN at
        # https://github.com/magicpro97/vibeflow/settings/secrets/actions
        # (a PAT from a bot account with `contents: write` and
        # `pull-requests: write` on the repo). Falls back to
        # GITHUB_TOKEN if the PAT is missing — which works only if
        # the repo setting "Allow GitHub Actions to create and
        # approve pull requests" is enabled.
        env:
          GITHUB_TOKEN: ${{ secrets.VIBEFLOW_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.VIBEFLOW_BOT_TOKEN || secrets.GITHUB_TOKEN }}
