name: CI
# IMPORTANT: This repo uses default GitHub Actions permissions (read-only).
# The `release-please` job needs "Allow GitHub Actions to create and approve
# pull requests" enabled in: Repo Settings → Actions → General → Workflow
# permissions. Without it, the job fails with:
#   "GitHub Actions is not permitted to create or approve pull requests."
# Alternative (more secure, optional): set PERSONAL_ACCESS_TOKEN secret and use
# it instead of GITHUB_TOKEN in the release-please step. See AGENTS.md →
# "Release-please setup" for details.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Runner priority:
#   Default: ubuntu-latest (GitHub-hosted, always available)
#   Self-hosted: set repo variable USE_SELF_HOSTED=true to switch to MacBook.
#     Go to Settings → Secrets and variables → Actions → Variables → New variable
#     Name: USE_SELF_HOSTED, Value: true
#     When the MacBook is online, jobs run faster (no GitHub queue).
#     When offline, set to 'false' (or delete the variable) to go back to cloud.
#     The self-hosted runner is a Mac on Apple Silicon registered at
#     ~/actions-runner-vibeflow/ with labels [self-hosted, macOS, ARM64].
#
# Self-hosted runner setup (one-time):
#   1. cd ~/actions-runner-vibeflow
#   2. ./config.sh --unattended --url https://github.com/magicpro97/vibeflow \
#       --token <registration-token-from-repo-settings> \
#       --labels "self-hosted,macOS,ARM64" \
#       --name "mac-selfhost-vibeflow"
#   3. ./run.sh   # or: ./svc.sh install && ./svc.sh start

jobs:
  check:
    needs: landing
    if: ${{ always() }}
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-latest' }}
    # Coverage instrumentation makes full-suite coverage gate ~10min, so 15m was too tight.
    timeout-minutes: 30
    steps:
      - name: Require landing gate
        if: ${{ needs.landing.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v4
        with:
          # The self-hosted runner accumulates stale uncommitted
          # deletions across runs (e.g. `.agents/skills/*` from a
          # prior WIP). `clean: true` forces a fresh checkout on
          # every CI run so tests that depend on tracked files
          # (e.g. `copySkillCreator` looking for
          # `.agents/skills/skill-creator/`) see a clean state.
          clean: true
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run file-size:check
      - run: bun run waiver:check
      - run: bun run build
      - run: bun run test
      - name: Smoke test built CLI (prints version)
        run: node dist/cli.js --version
      - name: Coverage gate — fail if line coverage < 100%
        run: bun run coverage:check
      - name: Ship-gate — real bridge dispatch must complete (no nothing works)
        run: bun run smoke
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Web UI e2e (real dashboard in Chromium)
        run: node scripts/clean-e2e-projects.mjs
      - name: Run Web UI e2e
        run: bun run test:e2e

  windows:
    strategy:
      matrix:
        include:
          - suite: owned-process
          - suite: package-smoke
          # #803: bare `vf`/`vf ui` shipped dead on Windows because no CI job ever started the
          # conversation bootstrap there; only `owned-process` and `package-smoke` ran, and both
          # stop at `--version`/`vf init`. This row runs the entry point itself.
          - suite: home-ui-bootstrap
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      VF_REQUIRE_LIVE_WINDOWS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        if: matrix.suite == 'package-smoke' || matrix.suite == 'home-ui-bootstrap'
        with:
          node-version: 20
      - run: bun ci
      - name: Assert a real Windows runtime
        # File-based (not an inline `bun -e`): bun 1.4.0 on Windows runners
        # can crash in its eval path (Bun "Features:" crash banner, exit 1)
        # even when the condition is false. The committed script runs on
        # every native Windows matrix row.
        run: bun run scripts/assert-win32.ts
      - name: Windows PID, Job Object, release, and orphan smoke
        if: matrix.suite == 'owned-process'
        run: bun test --timeout 30000 test/dispatch-owned-process-windows.test.ts test/dispatch-owned-process-windows-live.test.ts
      - name: Build shipped artifact
        if: matrix.suite == 'package-smoke' || matrix.suite == 'home-ui-bootstrap'
        run: bun run build
      - name: Conversation bootstrap through the shipped CLI (real vf ui on Windows)
        if: matrix.suite == 'home-ui-bootstrap'
        run: bun test --timeout 30000 test/windows-conversation-bootstrap-live.test.ts
      - name: Smoke test built CLI through Node
        if: matrix.suite == 'package-smoke'
        run: node dist/cli.js --version
      - name: Node runtime smoke over the private state path
        # The koffi backend only loads under Node; every other Windows row spawns bun. Boot the
        # shipped CLI in a throwaway project so the owner-only state tree goes through the Node
        # FFI path — a rejected directory exits the CLI before it ever writes the tree.
        if: matrix.suite == 'package-smoke'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "vf node state smoke"
          New-Item -ItemType Directory -Force $root | Out-Null
          Set-Location $root
          git init -q .
          $ui = Start-Process -FilePath node -ArgumentList "$env:GITHUB_WORKSPACE/dist/cli.js", "ui", "--port", "0", "--no-open" -PassThru -NoNewWindow -RedirectStandardOutput ui.log -RedirectStandardError ui.err
          # Poll rather than sleep a fixed budget: the runner's boot time varies, and the tree is
          # written by the same bootstrap that #803 rejected before it could run.
          $deadline = (Get-Date).AddSeconds(60)
          $tree = ".vibeflow/conversation/trace"
          while (-not (Test-Path $tree)) {
            if ($ui.HasExited) {
              Get-Content ui.log, ui.err
              throw "vf ui exited before booting (code=$($ui.ExitCode))"
            }
            if ((Get-Date) -gt $deadline) {
              throw "vf ui did not create the private conversation tree within 60s"
            }
            Start-Sleep -Milliseconds 500
          }
          Stop-Process -Id $ui.Id -Force
      - name: Pack and install shipped artifact in isolated path
        if: matrix.suite == 'package-smoke'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "vf package smoke"
          New-Item -ItemType Directory -Force $root | Out-Null
          $packOutput = & npm pack --pack-destination $root --json 2>$null
          if ($LASTEXITCODE -ne 0) { throw "npm pack failed with $LASTEXITCODE`n$($packOutput -join "`n")" }
          $json = ($packOutput -join "`n") | ConvertFrom-Json
          $tarball = Join-Path $root $json[0].filename
          $prefix = Join-Path $root "prefix"
          New-Item -ItemType Directory -Force $prefix | Out-Null
          $installOutput = & npm install --global --prefix $prefix $tarball --ignore-scripts 2>&1
          if ($LASTEXITCODE -ne 0) { throw "npm install failed with $LASTEXITCODE`n$($installOutput -join "`n")" }
          $vf = Join-Path $prefix "vf.cmd"
          if (-not (Test-Path $vf)) { throw "npm did not create Windows vf.cmd shim" }
          & $vf --version
          if ($LASTEXITCODE -ne 0) { throw "installed vf --version failed with $LASTEXITCODE" }
      - name: Run vf init through the installed Windows shim
        if: matrix.suite == 'package-smoke'
        shell: pwsh
        env:
          # copilot's readiness is `gh auth status`, which gh answers from this token. The
          # binary still has to exist: readiness short-circuits to "no-binary" before it ever
          # reaches the auth probe. Installing it is the cheap way to get one ready engine.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # This is the path a Windows user actually takes, and nothing else in CI covered it:
        # #801 shipped a `vf init` that failed on every Windows machine while CI stayed green,
        # because the suites above only ever ran `--version` and `git init`.
        #
        # Not --dry-run: dry-run skips activateProjectCapabilityAuthorityForVfInit, which is
        # the exact durability path #801 broke, so the gate has to take the writing path.
        run: |
          npm install --global @github/copilot --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "installing copilot CLI failed with $LASTEXITCODE" }
          $root = Join-Path $env:RUNNER_TEMP "vf package smoke"
          $vf = Join-Path (Join-Path $root "prefix") "vf.cmd"
          $project = Join-Path $root "init project"
          New-Item -ItemType Directory -Force $project | Out-Null
          Push-Location $project
          try {
            & git init --quiet .
            if ($LASTEXITCODE -ne 0) { throw "git init failed with $LASTEXITCODE" }
            & $vf init --no-ask --no-ai
            if ($LASTEXITCODE -ne 0) { throw "vf init failed with $LASTEXITCODE" }
            foreach ($artifact in @(".vibeflow", "AGENTS.md")) {
              if (-not (Test-Path (Join-Path $project $artifact))) {
                throw "vf init reported success but did not write $artifact"
              }
            }
            # Re-running must be idempotent: users hit this every time they re-init a project,
            # and it is the run that trips stale lock state left by the first one.
            & $vf init --no-ask --no-ai
            if ($LASTEXITCODE -ne 0) { throw "second vf init failed with $LASTEXITCODE" }
            & $vf doctor
            if ($LASTEXITCODE -ne 0) { throw "vf doctor failed with $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
      - name: Exercise installed package worktree path
        if: matrix.suite == 'package-smoke'
        run: bun test --timeout 30000 test/package-portability.test.ts

  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install locked landing dependencies
        working-directory: landing
        run: npm ci
      - name: Landing copy and mirror gate
        working-directory: landing
        run: npm test
      - name: Build landing
        working-directory: landing
        run: npm run build
      - name: Install landing browser
        working-directory: landing
        run: npx playwright install --with-deps chromium
      - name: Landing accessibility, responsive, and overflow gate
        working-directory: landing
        run: npm run test:a11y

  skill-validation:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run build
      - name: Skill validation gate
        run: node dist/cli.js skills ci-validation

  skill-security:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run build
      - name: Skill security gate
        run: node dist/cli.js skills ci-security

  domain-integrity:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run build
      - name: Domain integrity gate
        run: node dist/cli.js skills ci-domain-integrity

  release-prerequisites:
    needs:
      - check
      - windows
      - landing
      - skill-validation
      - skill-security
      - domain-integrity
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every same-SHA release gate
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LANDING_RESULT: ${{ needs.landing.result }}
          SKILL_VALIDATION_RESULT: ${{ needs.skill-validation.result }}
          SKILL_SECURITY_RESULT: ${{ needs.skill-security.result }}
          DOMAIN_INTEGRITY_RESULT: ${{ needs.domain-integrity.result }}
        run: |
          node -e "const names=['CHECK_RESULT','WINDOWS_RESULT','LANDING_RESULT','SKILL_VALIDATION_RESULT','SKILL_SECURITY_RESULT','DOMAIN_INTEGRITY_RESULT']; for (const name of names) if (process.env[name] !== 'success') throw new Error(name + ': ' + (process.env[name] || 'unset')); console.log('Release prerequisites passed for ' + process.env.GITHUB_SHA)"

  release-please:
    needs: release-prerequisites
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-latest' }}
    # Only run release-please on main-branch pushes. Self-hosted
    # runner so it doesn't queue on cloud throttling.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-prerequisites.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ github.sha }}
      - name: release-please action
        # Token priority:
        # 1. VIBEFLOW_BOT_TOKEN (PAT, no repo setting required)
        # 2. GITHUB_TOKEN (default, requires "Allow GitHub Actions
        #    to create and approve pull requests" in repo settings)
        #
        # Set VIBEFLOW_BOT_TOKEN at
        # https://github.com/magicpro97/vibeflow/settings/secrets/actions
        # (a PAT from a bot account with `contents: write` and
        # `pull-requests: write` on the repo). Falls back to
        # GITHUB_TOKEN if the PAT is missing — which works only if
        # the repo setting "Allow GitHub Actions to create and
        # approve pull requests" is enabled.
        env:
          GITHUB_TOKEN: ${{ secrets.VIBEFLOW_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.VIBEFLOW_BOT_TOKEN || secrets.GITHUB_TOKEN }}
